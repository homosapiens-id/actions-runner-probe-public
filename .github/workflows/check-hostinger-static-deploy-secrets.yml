name: check-hostinger-static-deploy-secrets
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence
        env:
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          SFTP_KEY: ${{ secrets.HOSTINGER_SFTP_KEY }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
        run: |
          python3 - <<'PY'
          import os
          names=["FTP_PASS","FTP_USER","FTP_HOST","SFTP_KEY","SSH_KEY","SSH_HOST","SSH_USER"]
          for name in names:
              print(f"{name}={'present' if os.getenv(name) else 'absent'}")
          PY
