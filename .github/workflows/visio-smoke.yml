name: visio-public-smoke
on: push
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Validar health publico da Visio
        shell: bash
        run: |
          set -euo pipefail
          URL="https://visio-runtime-preview.homosapiens.id/health"
          for i in {1..20}; do
            out=$(curl -fsSS --location --connect-timeout 5 --max-time 10 "$URL" 2>/dev/null || true)
            echo "attempt=$i body=$out"
            if echo "$out" | grep -q '"ok":true' && echo "$out" | grep -q '"service":"visio"'; then
              echo "VISIO_PUBLIC_HEALTH_OK"
              exit 0
            fi
            sleep 3
          done
          exit 1
