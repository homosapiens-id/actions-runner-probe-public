name: visio-live-check
on:
  push:
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar health e runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://visio-runtime-preview.homosapiens.id
          curl -fsSS "$BASE/health" -o health.json
          cat health.json
          grep -q '"ok":true' health.json
          grep -q '"version":"4.1.0"' health.json
          grep -q '"openai_configured":true' health.json
          grep -q '"cors_enabled":true' health.json
          curl -fsSS "$BASE/" -o root.html
          grep -q 'Visio Runtime 4.1.0' root.html
